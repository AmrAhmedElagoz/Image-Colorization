[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
include = ["color_image*"] 

[tool.setuptools.package-data]
color_image = ["assets/*.npy"]

[project]
name = "color_image"
version = "0.1.0"
description = "Learned Image Colorization with a Lightweight Diffusion/GAN Head"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.19.1",
    "numpy>=1.26",
    "scipy>=1.15,<1.18",
    "pillow>=10.2",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "diffusers>=0.32,<0.33",
    "transformers>=4.46,<4.47",
    "peft>=0.13,<0.14",
    "kornia>=0.7.4",
    "lpips>=0.1.4",
    "wandb>=0.18",
]

[project.scripts]
color_image-train = "color_image.train:main"
color_image-infer = "color_image.infer:main"

[project.optional-dependencies]

dev    = [
    "pytest==8.3.4",
    "Sphinx==8.1.3",
    "sphinx-rtd-theme==3.0.2",
    "sphinx-autodoc-typehints==2.5.0",
    "pytest-cov==6.0.0",
    "mypy==1.13.0",
    "flake8==7.1.1",
    "tox==4.23.2",
    "black==24.10.0",
    "pytest-mock==3.14.0",
    "pytest-watcher==0.4.3",
    "autopep8==2.3.2",
]



serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

base1 = [
    "torch>=2.5",
    "numpy>=1.26",
    "matplotlib>=3.9",     
    "scikit-image>=0.22",
    "pillow>=10.2",
    "ipython>=8.0",        
]


base2 = [
    "torch>=2.5",
    "torchvision>=0.19.1",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "diffusers>=0.32,<0.33",
    "transformers>=4.46,<4.47",
    "peft>=0.13,<0.14",
    "accelerate>=1.0,<1.2",
    "huggingface-hub>=0.26,<0.27",
    "kornia>=0.7.4",
    "lpips>=0.1.4",
    "pytorch-fid>=0.3.0",
    "scipy>=1.15,<1.18",
    "pillow>=10.2",
    "prettytable>=3.0",   
]

